name: בקשה לתכונה חדשה (עברית)
description: רעיון או שיפור
title: "[בקשה] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: באיזה חלק של התוכנה?
      options:
        - "כלי קודש (וורד) - כתבי הקודש"
        - "כלי קודש (וורד) - ספריית קיוויקס"
        - "כלי קודש (וורד) - היברו-בוקס"
        - "כלי קודש (וורד) - דרך האתרים"
        - "כלי קודש (וורד) - עיצוב תורני"
        - "כלי קודש (וורד) - נקדן דיקטה"
        - "כלי קודש (וורד) - חיפוש רגקס"
        - "כלי קודש (וורד) - שכפל חלונית צד / פתח מסמך בחלונית משנה"
        - "כלי קודש (וורד) - הגדרות / אודות"
        - "כתבי הקודש - קטלוג הספרים"
        - "כתבי הקודש - ספר פתוח (טקסט ומפרשים)"
        - "כתבי הקודש - חיפוש"
        - "כתבי הקודש - היברו-בוקס"
        - "כתבי הקודש - פתח קובץ"
        - "כתבי הקודש - חיפוש קבצים"
        - "כתבי הקודש - מילון"
        - "כתבי הקודש - לוח שנה"
        - "כתבי הקודש - מידות ושיעורים"
        - "כתבי הקודש - דף הבית"
        - "כתבי הקודש - הגדרות"
        - "תוסף לאוצריא"
        - "התקנה / עדכון"
        - "אחר (פרט למטה)"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: מה הצורך?
      description: "מה אתה מנסה לעשות היום ולמה זה קשה?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: איך היית רוצה שזה יעבוד?
      description: "תאר בצורה מעשית: איפה לוחצים ומה מופיע."
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: דוגמאות / צילומי מסך
      description: "לא חובה. למשל: איך זה נראה בתוכנה אחרת."
