name: דיווח על באג
description: משהו לא עובד כמו שצריך
title: "[באג] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "נא לדווח על באג אחד בלבד בכל דיווח. כמה בעיות = כמה דיווחים."
  - type: dropdown
    id: component
    attributes:
      label: באיזה חלק של התוכנה?
      options:
        - תוסף לוורד
        - התוכנה העצמאית (כתבי הקודש)
        - תוסף לאוצריא
        - חיפוש בטקסט מלא
        - תצוגת ספר / מפרשים
        - קטלוג ספרים / עץ ספרים
        - היברובוקס / PDF
        - חיפוש קבצים מקומיים
        - התקנה / עדכון
        - אחר (פרט למטה)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: גרסה
      description: "מופיעה בהגדרות → אודות, או בקובץ ההתקנה."
      placeholder: "לדוגמה: 2.4.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: שלבים לשחזור
      description: "מה לחצת בדיוק, לפי הסדר. כולל שם הספר / מילת החיפוש."
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: מה ציפית שיקרה?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: מה קרה בפועל?
    validations:
      required: true
  - type: textarea
    id: works
    attributes:
      label: מתי זה כן עובד תקין?
      description: "למשל: בספר אחר, בחיפוש אחר, אחרי הפעלה מחדש, בגרסה קודמת. אם לא בדקת - כתוב 'לא בדקתי'."
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: באיזו תדירות?
      options:
        - תמיד
        - לפעמים
        - קרה פעם אחת
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: הודעות שגיאה מהקונסול
      description: |
        בתוך החלון של התוכנה: לחץ F12 (או Ctrl+Shift+I) → לשונית Console → שחזר את הבאג → העתק את השורות האדומות לכאן.
        אם הופיעה הודעת שגיאה על המסך - העתק אותה. אם אין - כתוב 'אין'.
      render: shell
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: צילומי מסך
      description: "גרור לכאן תמונה או סרטון קצר שמראים את הבעיה."
    validations:
      required: true
