name: דיווח על באג
description: משהו לא עובד כמו שצריך
title: "[באג] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "נא לדווח על באג אחד בלבד בכל דיווח. כמה בעיות = כמה דיווחים."
  - type: dropdown
    id: component
    attributes:
      label: באיזה חלק של התוכנה?
      options:
        - "כלי קודש (וורד) - כתבי הקודש"
        - "כלי קודש (וורד) - ספריית קיוויקס"
        - "כלי קודש (וורד) - היברו-בוקס"
        - "כלי קודש (וורד) - דרך האתרים"
        - "כלי קודש (וורד) - עיצוב תורני"
        - "כלי קודש (וורד) - נקדן דיקטה"
        - "כלי קודש (וורד) - חיפוש רגקס"
        - "כלי קודש (וורד) - שכפל חלונית צד / פתח מסמך בחלונית משנה"
        - "כלי קודש (וורד) - הגדרות / אודות"
        - "כתבי הקודש - קטלוג הספרים"
        - "כתבי הקודש - ספר פתוח (טקסט ומפרשים)"
        - "כתבי הקודש - חיפוש"
        - "כתבי הקודש - היברו-בוקס"
        - "כתבי הקודש - פתח קובץ"
        - "כתבי הקודש - חיפוש קבצים"
        - "כתבי הקודש - מילון"
        - "כתבי הקודש - לוח שנה"
        - "כתבי הקודש - מידות ושיעורים"
        - "כתבי הקודש - דף הבית"
        - "כתבי הקודש - הגדרות"
        - "תוסף לאוצריא"
        - "התקנה / עדכון"
        - "אחר (פרט למטה)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: גרסה
      description: "מופיעה בהגדרות → אודות, או בקובץ ההתקנה."
      placeholder: "לדוגמה: 2.4.1"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: שלבים לשחזור
      description: "מה לחצת בדיוק, לפי הסדר. כולל שם הספר / מילת החיפוש."
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: מה ציפית שיקרה?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: מה קרה בפועל?
    validations:
      required: true
  - type: textarea
    id: works
    attributes:
      label: מתי זה כן עובד תקין?
      description: "למשל: בספר אחר, בחיפוש אחר, אחרי הפעלה מחדש, בגרסה קודמת. אם לא בדקת - כתוב 'לא בדקתי'."
    validations:
      required: false
  - type: dropdown
    id: frequency
    attributes:
      label: באיזו תדירות?
      options:
        - תמיד
        - לפעמים
        - קרה פעם אחת
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: הודעות שגיאה מהקונסול
      description: |
        בתוך החלון של התוכנה: לחץ F12 (או Ctrl+Shift+I) → לשונית Console → שחזר את הבאג → העתק את השורות האדומות לכאן.
        אם הופיעה הודעת שגיאה על המסך - העתק אותה. אם אין - כתוב 'אין'.
      render: shell
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: צילומי מסך
      description: "גרור לכאן תמונה או סרטון קצר שמראים את הבעיה."
    validations:
      required: false
