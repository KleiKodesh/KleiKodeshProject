# TEMPORARY probe: can a GitHub Windows runner build the VSTO add-in?
# Delete once answered.
name: VSTO build probe

on:
  push:
    paths: [.github/workflows/vsto-build-probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: KleiKodesh/EasyTabs
          path: ChromeTabs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: microsoft/setup-msbuild@v2

      - name: Is the Office/VSTO tooling installed?
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          "VS: $vs"
          Get-ChildItem "$vs\MSBuild\Microsoft\VisualStudio" -Recurse -Filter Microsoft.VisualStudio.Tools.Office.targets | % FullName
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Workload.Office -property installationPath

      - name: Install VSTO runtime (runner lacks Tools.Applications.Hosting)
        run: choco install vstor2010 -y --no-progress

      - name: npm ci (vue-frontend)
        working-directory: KitveiHakodesh/vue-frontend
        run: npm ci

      - name: Restore (solution, packages.config too)
        shell: pwsh
        run: |
          msbuild KleiKodeshProject.slnx -t:restore -v:minimal -nologo
          # packages.config projects each use their own ..\packages folder.
          git ls-files '*packages.config' | % {
            $dir = Split-Path $_
            nuget restore $_ -PackagesDirectory (Join-Path $dir '..\packages') -NonInteractive
          }

      - name: Dummy hb-mirror.json (real one comes from a secret)
        shell: pwsh
        run: Set-Content KitveiHakodesh/CSharpBackend/KitveiHakodesh.Core/HebrewBooks/hb-mirror.json '{}'

      - name: Build KleiKodeshVsto (unsigned)
        run: msbuild KleiKodeshVsto/KleiKodeshVsto.csproj -p:Configuration=Release -p:Platform=AnyCPU -p:SignManifests=false -v:minimal -nologo
