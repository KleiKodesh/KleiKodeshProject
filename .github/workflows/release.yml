# Builds the installer + portable zip and publishes the GitHub release -
# the same Build/scripts/build-installer.ps1 the local build menu runs.
# Start it from the Actions tab ("Run workflow") or: gh workflow run release.yml
#
# Also checks daily and releases by itself when the last release is a week old and
# there are new commits - never on Shabbat / Yom Tov, the day before, or the night after.
name: Release

on:
  schedule:
    - cron: "0 9 * * *"     # ~11:00-12:00 Israel; the gate job decides
  workflow_dispatch:
    inputs:
      version_increment:
        description: Version bump - auto lets Gemini decide (ignored when an exact version is given)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      manual_version:
        description: Exact version, e.g. v10.3.0 (optional)
        type: string
        required: false
      release_notes:
        description: Release notes - ai = Gemini writes Hebrew + English notes from the commits
        type: choice
        options: [ai, commits, file, both]
        default: ai
      delete_fts_index:
        description: Delete the FTS index on install (forces reindex)
        type: boolean
        default: false
      force_clean_install:
        description: Wipe + reinstall on launch
        type: boolean
        default: false
      dry_run:
        description: Dry run - build only, no release (files kept as a run artifact)
        type: boolean
        default: false
      attempt:
        description: Leave as is (counts automatic retries when Gemini is down)
        type: string
        default: "1"
      auto:
        description: Leave as is (marks retries of the weekly auto-release)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write          # retry-later + release-issue-check dispatches

concurrency:
  group: release
  cancel-in-progress: false

# Scheduled runs have no inputs: these are the defaults for them.
env:
  NOTES: ${{ inputs.release_notes || 'ai' }}
  BUMP: ${{ inputs.version_increment || 'auto' }}
  ATTEMPT: ${{ inputs.attempt || '1' }}
  AUTO: ${{ github.event_name == 'schedule' || inputs.auto == true }}

jobs:
  # Manual first attempt: always go. Scheduled runs and automatic retries: only on a
  # permitted day, and only when there is something new to release.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      renew: ${{ steps.check.outputs.renew }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          go() { echo "go=$1" >> "$GITHUB_OUTPUT"; echo "$2"; exit 0; }
          if [ "$SCHEDULED" != true ] && [ "$ATTEMPT" = 1 ]; then go true "manual run"; fi

          # Israel date. Friday = erev Shabbat, Saturday = Shabbat + motzaei Shabbat.
          export TZ=Asia/Jerusalem
          dow=$(date +%u); today=$(date +%F); tomorrow=$(date -d tomorrow +%F)
          if [ "$dow" -ge 5 ] && [ "$dow" -le 6 ]; then go false "Friday/Shabbat - not releasing"; fi
          # Yom Tov today (incl. its night) or tomorrow (erev Yom Tov). Israel calendar
          # (i=on): no second-day Yom Tov. Calendar down = don't release.
          yt=$(curl -sf --retry 3 "https://www.hebcal.com/hebcal?v=1&cfg=json&i=on&maj=on&min=off&mod=off&nx=off&ss=off&mf=off&c=off&start=$today&end=$tomorrow" \
                 | jq -r '[.items[] | select(.yomtov == true) | .date[0:10]] | unique | join(" ")') \
            || go false "hebcal unreachable - not releasing"
          if [ -n "$yt" ]; then go false "Yom Tov / erev Yom Tov ($yt) - not releasing"; fi

          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --exclude-drafts --json tagName,publishedAt --jq '.[0]')
          tag=$(jq -r .tagName <<<"$last")
          age=$(( ( $(date +%s) - $(date -d "$(jq -r .publishedAt <<<"$last")" +%s) ) / 86400 ))
          new=$(gh api "repos/$GITHUB_REPOSITORY/compare/$tag...${{ github.sha }}" --jq .ahead_by)
          # Every build signs with a fresh 5-year certificate, so the last release's
          # expires 5 years after it was published. 60 days before that, release again
          # (patch, no Gemini) even with no new commits.
          if [ "$age" -ge $(( 5 * 365 - 60 )) ]; then
            echo "renew=true" >> "$GITHUB_OUTPUT"
            go true "$tag signing certificate expires soon ($age days old) - renewal release"
          fi
          if [ "$new" -eq 0 ]; then go false "no commits since $tag"; fi
          if [ "$SCHEDULED" = true ] && [ "$age" -lt 7 ]; then go false "$tag is only $age day(s) old"; fi
          go true "$new new commit(s) since $tag ($age days)"

  # Gemini first, on a cheap Linux runner. No AI notes = no build; retry-later
  # starts the whole workflow again in an hour.
  plan:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      bump: ${{ steps.ai.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # release notes read the log since the last tag

      - name: Gemini - version bump + release notes
        id: ai
        if: needs.gate.outputs.renew != 'true' && (env.NOTES == 'ai' || (env.BUMP == 'auto' && !inputs.manual_version))
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ai-release-plan.ps1 -Auto:($env:AUTO -eq 'true')

      - uses: actions/upload-artifact@v7
        if: steps.ai.outcome == 'success'
        with:
          name: release-notes
          path: |
            RELEASE_NOTES.txt
            Build/Installer/ReleaseNotes/

  retry-later:
    needs: plan
    if: failure() && needs.plan.result == 'failure' && fromJSON(inputs.attempt || '1') < 24
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Wait an hour, then run Release again with the same inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3600
          gh workflow run release.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }} \
            -f version_increment="$BUMP" \
            -f manual_version='${{ inputs.manual_version }}' \
            -f release_notes="$NOTES" \
            -f delete_fts_index=${{ inputs.delete_fts_index || false }} \
            -f force_clean_install=${{ inputs.force_clean_install || false }} \
            -f dry_run=${{ inputs.dry_run || false }} \
            -f attempt=$(( ATTEMPT + 1 ))             -f auto=$AUTO

  release:
    needs: [gate, plan]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # release notes read the log since the last tag

      # Not in this repo: its own repository, gitignored here.
      - uses: actions/checkout@v7
        with:
          repository: KleiKodesh/EasyTabs
          path: ChromeTabs

      - uses: microsoft/setup-msbuild@v3

      # The runner has the Office build targets but not the VSTO runtime they load.
      - name: Install VSTO runtime + NSIS
        run: choco install vstor2010 nsis -y --no-progress

      # The signing certificate is made by build-installer.ps1 (fresh every build).
      - name: hb-mirror.json
        shell: pwsh
        env:
          HB_MIRROR_JSON: ${{ secrets.HB_MIRROR_JSON }}
        run: |
          [IO.File]::WriteAllText('KitveiHakodesh\CSharpBackend\KitveiHakodesh.Core\HebrewBooks\hb-mirror.json',
            $env:HB_MIRROR_JSON, (New-Object System.Text.UTF8Encoding($false)))

      - uses: actions/download-artifact@v8
        if: needs.gate.outputs.renew != 'true' && (needs.plan.outputs.bump != '' || env.NOTES == 'ai')
        with:
          name: release-notes

      # build-installer.ps1 also restores packages (msbuild, nuget, npm ci) and, after
      # releasing, pings the website and starts release-issue-check.yml - same as locally.
      - name: Build (and release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          $notes = $env:NOTES
          $bump  = $env:BUMP
          if ($notes -eq 'ai') { $notes = 'file' }               # Gemini wrote RELEASE_NOTES.txt
          if ($bump -eq 'auto') { $bump = '${{ needs.plan.outputs.bump }}' }
          if ('${{ needs.gate.outputs.renew }}' -eq 'true') { $notes = 'commits'; $bump = 'patch' }   # certificate renewal
          $a = @{ ReleaseNotesSource = $notes; NoClean = $true }
          if ('${{ inputs.manual_version }}') { $a.ManualVersion = '${{ inputs.manual_version }}' }
          else { $a.VersionIncrement = $bump }
          if ('${{ inputs.delete_fts_index }}' -eq 'true')    { $a.DeleteFtsIndex = $true }
          if ('${{ inputs.force_clean_install }}' -eq 'true') { $a.ForceCleanInstall = $true }
          if ('${{ inputs.dry_run }}' -eq 'true')             { $a.NoRelease = $true }
          & .\Build\scripts\build-installer.ps1 @a
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Keep the built files
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: Build/releases/*
