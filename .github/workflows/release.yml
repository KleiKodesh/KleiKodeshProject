# Builds the installer + portable zip and publishes the GitHub release —
# the same Build/scripts/build-installer.ps1 the local build menu runs.
# Start it from the Actions tab ("Run workflow") or: gh workflow run release.yml
name: Release

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: Version bump (ignored when an exact version is given)
        type: choice
        options: [patch, minor, major]
        default: patch
      manual_version:
        description: Exact version, e.g. v10.3.0 (optional)
        type: string
        required: false
      release_notes:
        description: Release notes from
        type: choice
        options: [commits, file, both]
        default: commits
      delete_fts_index:
        description: Delete the FTS index on install (forces reindex)
        type: boolean
        default: false
      force_clean_install:
        description: Wipe + reinstall on launch
        type: boolean
        default: false
      dry_run:
        description: Dry run - build only, no release (files kept as a run artifact)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # release notes read the log since the last tag

      # Not in this repo: its own repository, gitignored here.
      - uses: actions/checkout@v4
        with:
          repository: KleiKodesh/EasyTabs
          path: ChromeTabs

      - uses: microsoft/setup-msbuild@v2

      # The runner has the Office build targets but not the VSTO runtime they load.
      - name: Install VSTO runtime + NSIS
        run: choco install vstor2010 nsis -y --no-progress

      - name: Restore packages
        shell: pwsh
        run: |
          msbuild KleiKodeshProject.slnx -t:restore -v:minimal -nologo
          # packages.config projects each use their own ..\packages folder.
          git ls-files '*packages.config' | % {
            nuget restore $_ -PackagesDirectory (Join-Path (Split-Path $_) '..\packages') -NonInteractive
          }

      - name: npm ci (vue-frontend)
        working-directory: KitveiHakodesh/vue-frontend
        run: npm ci

      - name: Secrets -> files (signing cert, hb-mirror.json)
        shell: pwsh
        env:
          VSTO_PFX_BASE64: ${{ secrets.VSTO_PFX_BASE64 }}
          HB_MIRROR_JSON: ${{ secrets.HB_MIRROR_JSON }}
        run: |
          $pfx = 'KleiKodeshVsto\KleiKodesh_TemporaryKey.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:VSTO_PFX_BASE64))
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My | Out-Null
          [IO.File]::WriteAllText('KitveiHakodesh\CSharpBackend\KitveiHakodesh.Core\HebrewBooks\hb-mirror.json',
            $env:HB_MIRROR_JSON, (New-Object System.Text.UTF8Encoding($false)))

      - name: Build (and release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $a = @{ ReleaseNotesSource = '${{ inputs.release_notes }}'; NoClean = $true }
          if ('${{ inputs.manual_version }}') { $a.ManualVersion = '${{ inputs.manual_version }}' }
          else { $a.VersionIncrement = '${{ inputs.version_increment }}' }
          if ('${{ inputs.delete_fts_index }}' -eq 'true')    { $a.DeleteFtsIndex = $true }
          if ('${{ inputs.force_clean_install }}' -eq 'true') { $a.ForceCleanInstall = $true }
          if ('${{ inputs.dry_run }}' -eq 'true')             { $a.NoRelease = $true }
          & .\Build\scripts\build-installer.ps1 @a
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Keep the built files
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: Build/releases/*

      # A release made with github.token does not fire notify-website.yml,
      # so ping the website from here.
      - name: Update the website download link
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: gh api repos/KleiKodesh/kleikodesh.github.io/dispatches -f event_type=release-changed
