# Keeps the shared Google Drive folder in sync with GitHub releases:
#   folder root          = latest release (installers, portable zip, Hebrew and English release notes as Google Docs)
#   previous subfolder   = the release before it (fallback in case of bugs)
# Anything older, or of a deleted release, goes to the Drive trash. Other files in the folder are untouched.
# The run reads the current releases, so it is safe to start any number of times.
# Started by build-installer.ps1 after the assets are uploaded (CI releases fire no release events),
# by release events from manual edits/deletes, and daily as a safety net.
name: Drive sync

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted, unpublished]
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FOLDER_ID: 16lBZzaLRjdz5aIG54Uanhmdk9EczwEKo   # the KleiKodesh folder in the shared Drive
      PREVIOUS_DIR: גרסה קודמת
      NOTES_HE: מה חדש
      NOTES_EN: Release notes
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.RCLONE_GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the latest two releases
        run: |
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                   --limit 2 --json tagName --jq '.[].tagName')
          [ -n "$tags" ] || { echo "No releases - nothing to sync."; exit 1; }
          sudo apt-get install -y -qq pandoc > /dev/null
          sub=""
          for tag in $tags; do
            mkdir -p "mirror/$sub" "notes/$sub"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "mirror/$sub" \
              --pattern 'KleiKodeshSetup-*.exe' --pattern 'KitveiHakodeshPortable-*.zip'
            # The notes are Hebrew, a "---" line, then English: one doc each.
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md
            awk '/^---[[:space:]]*$/ && !s { s=1; next } !s' body.md | grep -v -i '^</\?div' \
              | pandoc -f gfm -t docx -M dir=rtl -M lang=he -o "notes/$sub/$NOTES_HE - $tag.docx"
            if grep -q '^---[[:space:]]*$' body.md; then
              awk 's; /^---[[:space:]]*$/ { s=1 }' body.md \
                | pandoc -f gfm -t docx -M lang=en -o "notes/$sub/$NOTES_EN - $tag.docx"
            fi
            sub="$PREVIOUS_DIR"
          done
          find mirror notes -type f | sort

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      # Release notes are left out of the sync: they are Google Docs on Drive, re-created below.
      - name: Sync to Drive
        run: |
          rclone sync mirror gdrive: --drive-root-folder-id "$FOLDER_ID" -v \
            --filter "- $NOTES_HE - *" --filter "- $NOTES_EN - *" \
            --filter '+ /KleiKodeshSetup-*.exe' --filter '+ /KitveiHakodeshPortable-*.zip' \
            --filter "+ /$PREVIOUS_DIR/**" --filter '- *'

      - name: Release notes as Google Docs
        run: |
          rclone delete gdrive: --drive-root-folder-id "$FOLDER_ID" --include 'ReleaseNotes-*' \
            --include "$NOTES_HE - *" --include "$NOTES_EN - *" -v
          rclone copy notes gdrive: --drive-root-folder-id "$FOLDER_ID" --drive-import-formats docx -v
