[package]
name = "kleikodesh-setup"
version = "0.1.0"
edition = "2021"
default-run = "kleikodesh-setup"

[[bin]]
name = "kleikodesh-setup"
path = "src/main.rs"

# Build tool: packs the product files and appends them to the setup exe.
[[bin]]
name = "pack-payload"
path = "src/bin/pack-payload.rs"

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
winreg = "0.52"
tar = "0.4"
serde_json = "1"
xz2 = { version = "0.1", features = ["static"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Smallest size overall, but full speed where the screen is drawn: the software renderer,
# glyph/text shaping and image decoding. Switching theme or language repaints everything.
[profile.release.package.i-slint-core]
opt-level = 3
[profile.release.package.i-slint-renderer-software]
opt-level = 3
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.swash]
opt-level = 3
[profile.release.package.skrifa]
opt-level = 3
[profile.release.package.read-fonts]
opt-level = 3
[profile.release.package.zeno]
opt-level = 3
[profile.release.package.parley]
opt-level = 3

# Fast local iteration: `cargo build --profile quick`. Optimized, but no LTO and
# parallel codegen, so a change relinks in seconds instead of minutes.
# Release (LTO, one codegen unit) is for the shipped exe only.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
